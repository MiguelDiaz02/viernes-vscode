# Entorno de la clase "VS Code desde cero" · Viernes de Bioinformática
#
# Instalar (una sola vez, desde la carpeta del repositorio):
#   conda env create -f instalacion/environment.yml
#
# Activar:
#   conda activate viernes-vscode
#
# Registrar el kernel para notebooks (opcional pero recomendado):
#   python -m ipykernel install --user --name viernes-vscode --display-name "Python (viernes-vscode)"
#
# Comprobar que todo quedó bien:
#   python instalacion/verificar_instalacion.py

name: viernes-vscode
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pandas>=2.2
  - numpy
  - matplotlib>=3.9
  - ipykernel
  - ruff
